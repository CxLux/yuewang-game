# 《文枢·寻迹》Nginx 反向代理配置（参考）
# 放置位置：Ubuntu 为 /etc/nginx/sites-available/wenshu（再 ln -s 到 sites-enabled）
#          CentOS/宝塔 为 /etc/nginx/conf.d/wenshu.conf
# 改完执行：nginx -t && nginx -s reload

server {
    listen 80;
    # 用 IP 直接访问时保持 _；备案域名下来后改成你的域名
    server_name _;

    client_max_body_size 10m;

    # 所有请求反代到本机 3000 端口
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket 升级（聊天 / 飞花令对战 必需）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # 文本类资源压缩，降低流量（69MB 的 game.html 是 base64，压缩收益有限，主要靠 CDN）
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
